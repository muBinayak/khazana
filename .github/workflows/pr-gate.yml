name: PR Gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [master]

permissions:
  contents: write          # checkout + commit the stack-detection cache on push
  pull-requests: write     # dependency-review + Trivy + pgpverify + SpotBugs PR review comments
  security-events: write   # SARIF uploads to the Security tab
  checks: write            # reviewdog PR annotations on high-volume scanners (github-pr-check)

jobs:
  pr-gate:
    # Sandbox ref (muBinayak org, holding the updated gate under test).
    uses: muBinayak/kattu/.github/workflows/pr-gate.yml@esignet-343
    with:
      SERVICE_LOCATION: '.'
      JAVA_SERVICE_LOCATION: './kernel'
    secrets: inherit
